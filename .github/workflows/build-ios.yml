name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Detect iOS workspace and app scheme
        id: ios
        shell: bash
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: iOS workspace not found"
            exit 1
          fi

          echo "Workspace: $WORKSPACE"

          SCHEMES=$(xcodebuild -list -json -workspace "$WORKSPACE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          schemes = data.get('workspace', {}).get('schemes', [])
          print('\n'.join(schemes))
          ")

          SCHEME=""

          while IFS= read -r CANDIDATE; do
            [ -z "$CANDIDATE" ] && continue

            echo "Checking scheme: $CANDIDATE"

            SETTINGS=$(xcodebuild \
              -showBuildSettings \
              -workspace "$WORKSPACE" \
              -scheme "$CANDIDATE" \
              -configuration Release \
              -sdk iphoneos 2>/dev/null || true)

            if echo "$SETTINGS" | grep -q "PRODUCT_TYPE = com.apple.product-type.application"; then
              SCHEME="$CANDIDATE"
              break
            fi
          done <<< "$SCHEMES"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: No iOS application scheme found"
            echo "Available schemes:"
            echo "$SCHEMES"
            exit 1
          fi

          echo "Selected scheme: $SCHEME"

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build unsigned iOS app
        run: |
          DERIVED_DATA="$GITHUB_WORKSPACE/ios-build"

          xcodebuild \
            -workspace "${{ steps.ios.outputs.workspace }}" \
            -scheme "${{ steps.ios.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        shell: bash
        run: |
          DERIVED_DATA="$GITHUB_WORKSPACE/ios-build"

          echo "Searching for built iOS application..."

          APP_PATH=$(find "$DERIVED_DATA/Build/Products" \
            -type d \
            -name "*.app" \
            -path "*/Release-iphoneos/*" \
            -not -path "*/Pods/*" \
            -print -quit 2>/dev/null)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: App build not found"
            echo "Build products:"
            find "$DERIVED_DATA/Build/Products" -maxdepth 6 -print 2>/dev/null || true
            exit 1
          fi

          echo "Found app: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          zip -r Mochi-unsigned.ipa Payload

          rm -rf Payload

          echo "IPA created:"
          ls -lh Mochi-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mochi-iOS-IPA
          path: Mochi-unsigned.ipa
          retention-days: 7
          if-no-files-found: error